<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>blerb</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef2f6; --card: #ffffff; --ink: #33414f; --dim: #7a8894;
        --line: #dde5ec; --accent: #4a8fc7;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #171c22; --card: #1f262e; --ink: #cdd6df; --dim: #78858f; --line: #2b333c; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 20px; background: var(--bg); color: var(--ink);
        font: 13px/1.6 "Segoe UI", system-ui, sans-serif; user-select: none;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: var(--dim); margin: 0 0 16px; font-size: 12px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; margin-bottom: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .row:last-child { border-bottom: none; }
      .row label { flex: 1; }
      .row .hint { display: block; color: var(--dim); font-size: 11px; }
      input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
      input[type="range"] { width: 120px; accent-color: var(--accent); }
      select {
        background: var(--card); color: var(--ink); border: 1px solid var(--line);
        border-radius: 7px; padding: 4px 8px; font: inherit; max-width: 160px;
      }
      input[type="text"] {
        background: var(--card); color: var(--ink); border: 1px solid var(--line);
        border-radius: 7px; padding: 4px 8px; font: inherit; width: 110px;
      }
      input[type="text"].wide { width: 170px; }
      .row.col { flex-direction: column; align-items: stretch; gap: 4px; }
      .summary { margin: 4px 0 2px; padding-left: 18px; }
      .summary li { padding: 1px 0; }
      .summary li.quiet { color: var(--dim); list-style: none; margin-left: -18px; }
      .val { color: var(--dim); font-variant-numeric: tabular-nums; width: 26px; text-align: right; }
      .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
      .foot .pack { color: var(--dim); font-size: 12px; }
      button {
        background: none; border: 1px solid var(--line); color: var(--ink);
        border-radius: 7px; padding: 6px 14px; font: inherit; cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>blerb</h1>
    <p class="sub">Everything here is optional. Defaults are the quiet ones.</p>

    <div class="card">
      <div class="row">
        <label for="petVisible">Pet visible</label>
        <input type="checkbox" id="petVisible" />
      </div>
      <div class="row">
        <label for="captureProtection">Invisible in screen capture
          <span class="hint">Enforced by Windows itself — the pet never appears in shares or recordings.</span>
        </label>
        <input type="checkbox" id="captureProtection" />
      </div>
      <div class="row">
        <label for="launchAtLogin">Start with Windows</label>
        <input type="checkbox" id="launchAtLogin" />
      </div>
    </div>

    <div class="card">
      <div class="row">
        <label for="pack">Pet
          <span class="hint">Anything in the packs folder — imports land here too.</span>
        </label>
        <select id="pack"></select>
      </div>
      <div class="row">
        <label for="importBtn">Import your own art
          <span class="hint">Animated GIFs (walk.gif, idle.gif…) or one picture, which learns to walk on its own.</span>
        </label>
        <input type="text" id="importName" placeholder="name (optional)" />
        <button id="importBtn">Choose files…</button>
      </div>
      <div class="row">
        <label for="addAnimBtn">Add art to this pet
          <span class="hint">One animated GIF. <b>surprise</b> plays on its own now and then; <b>interact</b> plays for a few seconds when your cursor touches the pet.</span>
        </label>
        <select id="addAnimSlot">
          <option value="surprise">surprise</option>
          <option value="interact">interact</option>
          <option value="idle">idle</option>
          <option value="walk">walk</option>
          <option value="sit">sit</option>
          <option value="sleep">sleep</option>
        </select>
        <button id="addAnimBtn">Choose GIF…</button>
      </div>
      <div class="row" id="importStatusRow" hidden>
        <span class="hint" id="importStatus"></span>
      </div>
      <div class="row">
        <label for="petScale">Pet size</label>
        <input type="range" id="petScale" min="1" max="4" step="1" />
        <span class="val" id="petScaleVal">2×</span>
      </div>
      <div class="row">
        <label for="climbing">Can climb walls
          <span class="hint">Clings to the outer edges of the desktop, and climbs between stacked monitors.</span>
        </label>
        <input type="checkbox" id="climbing" />
      </div>
      <div class="row">
        <label for="hanging">Can hang upside down
          <span class="hint">Hangs under the top edge of any window, and the top of the screen.</span>
        </label>
        <input type="checkbox" id="hanging" />
      </div>
      <div class="row">
        <label for="smoothTracking">Follow moving windows smoothly
          <span class="hint">Watches the desktop ~60×/s while you drag or resize a window, so the pet rides it instead of catching up in steps. Costs about 1% of one CPU core, only while something is moving.</span>
        </label>
        <input type="checkbox" id="smoothTracking" />
      </div>
      <div class="row">
        <label for="debugOverlay">Debug overlay
          <span class="hint">Draws the platforms the pet believes in. Useful, unglamorous.</span>
        </label>
        <input type="checkbox" id="debugOverlay" />
      </div>
    </div>

    <div class="card">
      <div class="row col">
        <label>Today
          <span class="hint">After the fact, in plain words. It doesn't tick while you watch — it's read fresh each time this window comes to the front.</span>
        </label>
        <ul id="summary" class="summary"></ul>
      </div>
      <div class="row">
        <label for="focusApps">Focus apps
          <span class="hint">Process names, comma-separated. Time in these counts as focus; a session is a stretch of it.</span>
        </label>
        <input type="text" id="focusApps" class="wide" placeholder="code, obsidian, word" />
      </div>
      <div class="row">
        <label for="elsewhereApps">Elsewhere apps
          <span class="hint">Ships empty on purpose. Anything you don't list is neutral.</span>
        </label>
        <input type="text" id="elsewhereApps" class="wide" placeholder="" />
      </div>
      <div class="row">
        <label>Last app in front: <b id="nowApp">—</b>
          <span class="hint">So you don't have to guess how a program spells its exe. A process name is all blerb ever sees.</span>
        </label>
        <button id="nowFocus" disabled>+ focus</button>
      </div>
    </div>

    <div class="foot">
      <span class="pack"></span>
      <button id="quit">Quit blerb</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const bools = ['petVisible', 'captureProtection', 'launchAtLogin', 'climbing', 'hanging', 'smoothTracking', 'debugOverlay'];

      let classification = { focus: [], elsewhere: [] };
      function render(s) {
        for (const k of bools) $(k).checked = s[k];
        $('petScale').value = s.petScale;
        $('petScaleVal').textContent = s.petScale + '×';
        if ([...$('pack').options].some((o) => o.value === s.pack)) $('pack').value = s.pack;
        classification = s.classification || { focus: [], elsewhere: [] };
        // Never overwrite a list the user is in the middle of typing.
        for (const [id, key] of [['focusApps', 'focus'], ['elsewhereApps', 'elsewhere']]) {
          if (document.activeElement !== $(id)) $(id).value = classification[key].join(', ');
        }
        syncNowButton();
      }

      // The same spelling rule main applies before saving: lowercase, no .exe.
      const norm = (s) => s.trim().toLowerCase().replace(/\.exe$/, '');
      function syncNowButton() {
        const now = $('nowApp').textContent;
        $('nowFocus').disabled = !now || now === '—' || classification.focus.some((f) => norm(f) === norm(now));
      }

      // ---- the retrospective: pulled when the window comes to the front ----
      async function refreshSummary() {
        const [{ lines }, now] = await Promise.all([window.blerbSettings.summary(), window.blerbSettings.currentApp()]);
        $('summary').replaceChildren(
          ...lines.map((text, i) => Object.assign(document.createElement('li'), {
            textContent: text,
            className: lines.length === 1 && i === 0 && /^Nothing/.test(text) ? 'quiet' : '',
          })),
        );
        $('nowApp').textContent = now || '—';
        syncNowButton();
      }
      refreshSummary();
      addEventListener('focus', refreshSummary);

      const parseList = (s) => [...new Set(s.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean))];
      function saveLists() {
        window.blerbSettings.set({
          classification: { focus: parseList($('focusApps').value), elsewhere: parseList($('elsewhereApps').value) },
        });
      }
      $('focusApps').addEventListener('change', saveLists);
      $('elsewhereApps').addEventListener('change', saveLists);
      $('nowFocus').addEventListener('click', () => {
        const now = $('nowApp').textContent;
        if (!now || now === '—') return;
        const current = parseList($('focusApps').value);
        if (!current.some((f) => norm(f) === norm(now))) {
          $('focusApps').value = [...current, now].join(', ');
          saveLists();
        }
        $('nowFocus').disabled = true;
      });

      function refreshPacks() {
        return window.blerbSettings.packs().then((packs) => {
          $('pack').replaceChildren(
            ...packs.map((p) => Object.assign(document.createElement('option'), { value: p.id, textContent: p.name })),
          );
          return window.blerbSettings.get().then(render);
        });
      }
      // The pack list first, so render() can select the current one.
      refreshPacks();
      window.blerbSettings.onChange(render);
      $('pack').addEventListener('change', (e) => window.blerbSettings.set({ pack: e.target.value }));

      $('addAnimBtn').addEventListener('click', async () => {
        const status = $('importStatus');
        const slot = $('addAnimSlot').value;
        $('addAnimBtn').disabled = true;
        $('importStatusRow').hidden = false;
        status.textContent = `adding ${slot}…`;
        try {
          const r = await window.blerbSettings.addAnimation(slot);
          if (r.canceled) { $('importStatusRow').hidden = true; return; }
          status.textContent = r.ok
            ? (slot === 'interact' ? `Added ${slot} — touch the pet with your cursor.` : slot === 'surprise' ? `Added ${slot} — it plays on its own now and then.` : `Added ${slot}.`) + (r.warning ? ' ' + r.warning : '')
            : (r.error || 'could not add the animation');
        } catch (err) {
          status.textContent = 'could not add the animation: ' + (err && err.message ? err.message : err);
        } finally {
          $('addAnimBtn').disabled = false;
        }
      });

      $('importBtn').addEventListener('click', async () => {
        const status = $('importStatus');
        $('importBtn').disabled = true;
        $('importStatusRow').hidden = false;
        status.textContent = 'importing…';
        try {
          const r = await window.blerbSettings.importPet($('importName').value.trim() || undefined);
          if (r.canceled) { $('importStatusRow').hidden = true; return; }
          if (r.ok) {
            status.textContent = `Imported ${r.name} — say hi to your new pet.`;
            $('importName').value = '';
            await refreshPacks();
          } else {
            status.textContent = r.error || 'import failed';
          }
        } catch (err) {
          // An IPC-level rejection must not strand "importing…" on screen.
          status.textContent = 'import failed: ' + (err && err.message ? err.message : err);
        } finally {
          $('importBtn').disabled = false;
        }
      });

      for (const k of bools) {
        $(k).addEventListener('change', (e) => window.blerbSettings.set({ [k]: e.target.checked }));
      }
      $('petScale').addEventListener('input', (e) => {
        window.blerbSettings.set({ petScale: Number(e.target.value) });
      });
      $('quit').addEventListener('click', () => window.blerbSettings.quit());
    </script>
  </body>
</html>
